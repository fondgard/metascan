name: Security Audit & SAST CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  audit-and-test:
    name: SAST & Quality Audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
          python -m pip install flake8 bandit

      - name: Lint with Flake8 (PEP-8 Compliance)
        run: |
          # Stop the build if there are Python syntax errors or PEP-8 violations
          flake8 metascan tests

      - name: Static Application Security Testing (Bandit SAST)
        run: |
          # Run Bandit SAST security audit across the codebase
          bandit -r metascan

      - name: Run Test Suite (Pytest)
        run: |
          # Verify functionality, network mocks, and regression suites
          pytest -v
