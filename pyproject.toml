[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metascan"
version = "1.0.0"
description = "Async OSINT CLI tool — aggregate, verify, and visualize digital identities"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "fondgard" }]
keywords = ["osint", "cli", "username", "sherlock", "maigret", "blackbird"]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx[http2]>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "jinja2>=3.1.4",
    "sherlock-project>=0.16.0",
    "maigret>=0.6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
mns = "metascan.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["metascan*"]

[tool.setuptools.package-data]
metascan = ["templates/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
